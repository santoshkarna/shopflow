services:
  mysqldb:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: product_db
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    ports:
      - "${MYSQL_HOST_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - product-network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping --host=localhost --user=root --password=\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  productservice:
    build:
      context: ./product-service
      dockerfile: Dockerfile
    depends_on:
      mysqldb:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysqldb:3306/product_db
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    ports:
      - "9090:9090"
    volumes:
      - product_logs:/app/logs
    networks:
      - product-network
    restart: unless-stopped

networks:
  product-network:
    driver: bridge

volumes:
  mysql_data:
  product_logs: