spring:
  application:
    name: product-service
  datasource:
    url: jdbc:postgresql://127.0.0.1:15432/product_db
    username: product_user
    password: product_pass
    flyway:
      locations: classpath:db/migration,classpath:db/seed

server:
  port: 9090


logging:
  level:
    root: INFO                                 # default for everything
    com.diyo.product: DEBUG             # our code shows DEBUG and above
    com.diyo.product.repository: TRACE  # repo package even more verbose
    org.springframework.web: INFO              # quiet the framework
